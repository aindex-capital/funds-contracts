[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
auto_detect_remappings = false
# Deploy scripts read their configuration and write the deployment record.
fs_permissions = [{ access = "read", path = "./script" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC}"

[fmt]
line_length = 120
